<text x="56" y="164" class="head" fill="#3458a4">CPU Demo</text>
<text x="56" y="198" class="body" fill="#172b46">CLI / Web Portal</text>
<text x="56" y="231" class="body" fill="#172b46">Fake 环境与任务结果</text>
<text x="56" y="277" class="small" fill="#586779">无需权重、场景或轨迹</text>
<rect x="342" y="112" width="365" height="235" rx="9" fill="#f8fafc" stroke="#d9e1eb"/>
<text x="362" y="147" class="head" fill="#3458a4">RoboCasa 仿真</text>
<text x="362" y="181" class="body" fill="#172b46">场景与物体资产 · RoboCasa 包目录</text>
<text x="362" y="213" class="body" fill="#172b46">Xiaomi / Qwen 权重 · 数据目录</text>
