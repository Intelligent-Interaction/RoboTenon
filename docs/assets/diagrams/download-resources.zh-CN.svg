<text x="779" y="214" class="body" fill="#172b46">训练、分析或轨迹回放</text>
<text x="779" y="248" class="body" fill="#172b46">RoboCasa 项目旁的 datasets/</text>
<text x="779" y="281" class="small" fill="#586779">只跑在线任务无需下载</text>
<path d="M291 222 H342" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M707 222 H758" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
