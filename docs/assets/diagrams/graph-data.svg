<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">Explicit Graph data flow</title><desc id="desc">Successors bind public node outputs through inputs. Graph.outputs defines the result returned to the caller.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#586779"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif} .title{font-size:27px;font-weight:600} .sub{font-size:16px} .head{font-size:20px;font-weight:600} .body{font-size:17px} .small{font-size:15px}</style>
<rect width="1120" height="400" fill="#fff"/>
<text x="36" y="48" class="title" fill="#172b46">Explicit Graph data flow</text>
<text x="36" y="78" class="sub" fill="#586779">Successors bind public node outputs through inputs. Graph.outputs defines the result returned to the caller.</text>
<path d="M36 99 H1084" stroke="#d9e1eb"/>
<rect x="36" y="144" width="230" height="126" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M37 158 v98" stroke="#3458a4" stroke-width="3"/>
<text x="54" y="176" class="head" fill="#3458a4">Node A</text>
<text x="54" y="205" class="body" fill="#172b46">return {text: …}</text>
<text x="54" y="231" class="body" fill="#172b46">nodes.a.outputs.text</text>
<rect x="323" y="144" width="230" height="126" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M324 158 v98" stroke="#3458a4" stroke-width="3"/>
<text x="341" y="176" class="head" fill="#3458a4">Node B inputs</text>
<text x="341" y="205" class="body" fill="#172b46">Bind source to node A</text>
<text x="341" y="231" class="body" fill="#172b46">ctx.inputs[&quot;text&quot;]</text>
<rect x="610" y="144" width="215" height="126" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M611 158 v98" stroke="#3458a4" stroke-width="3"/>
<text x="628" y="176" class="head" fill="#3458a4">Node B outputs</text>
<text x="628" y="205" class="body" fill="#172b46">return {message: …}</text>
<text x="628" y="231" class="body" fill="#172b46">Read after commit</text>
<rect x="882" y="144" width="202" height="126" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M883 158 v98" stroke="#3458a4" stroke-width="3"/>
<text x="900" y="176" class="head" fill="#3458a4">Graph.outputs</text>
<text x="900" y="205" class="body" fill="#172b46">Bind public fields</text>
<text x="900" y="231" class="body" fill="#172b46">Return to caller</text>
<path d="M266 207 L323 207" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M553 207 L610 207" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M825 207 L882 207" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="36" y="327" class="head" fill="#29735c">next and goto select execution order. inputs and outputs select data sources.</text>
<text x="36" y="376" class="small" fill="#586779">Use explicit bindings to pass data between nodes. Temporary values stay local.</text>
</svg>
