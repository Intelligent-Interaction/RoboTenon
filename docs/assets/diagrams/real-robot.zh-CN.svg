<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="610" viewBox="0 0 1120 610" role="img" aria-labelledby="title desc">
<title id="title">真机部署：观测、控制与停止</title><desc id="desc">站点插件负责连接厂商 SDK / ROS2；配置模板只负责组合这些插件。</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#586779"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif} .title{font-size:27px;font-weight:600} .sub{font-size:16px} .head{font-size:20px;font-weight:600} .body{font-size:17px} .small{font-size:15px}</style>
<rect width="1120" height="610" fill="#fff"/>
<text x="36" y="48" class="title" fill="#172b46">真机部署：观测、控制与停止</text>
<text x="36" y="78" class="sub" fill="#586779">站点插件负责连接厂商 SDK / ROS2；配置模板只负责组合这些插件。</text>
<path d="M36 99 H1084" stroke="#d9e1eb"/>
<rect x="36" y="137" width="316" height="116" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M37 151 v88" stroke="#3458a4" stroke-width="3"/>
<text x="54" y="169" class="head" fill="#3458a4">模型服务（可独立主机）</text>
<text x="54" y="198" class="body" fill="#172b46">HLP / VLA 推理服务</text>
<text x="54" y="224" class="body" fill="#172b46">输入输出必须匹配设备契约</text>
<rect x="430" y="137" width="316" height="116" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M431 151 v88" stroke="#3458a4" stroke-width="3"/>
<text x="448" y="169" class="head" fill="#3458a4">运行主机</text>
<text x="448" y="198" class="body" fill="#172b46">CLI / Portal + 单 Worker</text>
<text x="448" y="224" class="body" fill="#172b46">Graph + 站点插件</text>
<path d="M430 174 L352 174" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="370" y="161" class="small" fill="#586779">请求</text>
<path d="M352 222 L430 222" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="370" y="210" class="small" fill="#586779">结果</text>
<rect x="36" y="333" width="280" height="121" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M37 347 v93" stroke="#3458a4" stroke-width="3"/>
<text x="54" y="365" class="head" fill="#3458a4">观测源</text>
<text x="54" y="394" class="body" fill="#172b46">相机、关节与任务信号</text>
<text x="54" y="420" class="body" fill="#172b46">RealRobotAdapter</text>
<rect x="410" y="333" width="280" height="121" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M411 347 v93" stroke="#3458a4" stroke-width="3"/>
<text x="428" y="365" class="head" fill="#3458a4">设备驱动</text>
<text x="428" y="394" class="body" fill="#172b46">RealRobotBody + driver</text>
<text x="428" y="420" class="body" fill="#172b46">execute / hold / stop</text>
<rect x="794" y="333" width="290" height="121" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M795 347 v93" stroke="#29735c" stroke-width="3"/>
<text x="812" y="365" class="head" fill="#29735c">机器人与控制器</text>
<text x="812" y="394" class="body" fill="#172b46">限位、控制模式、回读</text>
<text x="812" y="420" class="body" fill="#172b46">独立硬件急停链路</text>
<path d="M176 333 L176 294 L473 294 L473 253" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="203" y="285" class="small" fill="#586779">feedback</text>
<path d="M587 253 L587 333" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="600" y="294" class="small" fill="#586779">Action</text>
<path d="M690 381 L794 381" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="693" y="369" class="small" fill="#586779">SDK / ROS2</text>
<path d="M794 427 L731 427 L731 494 L177 494 L177 454" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="439" y="486" class="small" fill="#586779">状态 / 传感器</text>
<rect x="805" y="137" width="279" height="116" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M806 151 v88" stroke="#29735c" stroke-width="3"/>
<text x="823" y="169" class="head" fill="#29735c">软件停止</text>
<text x="823" y="198" class="body" fill="#172b46">共享 SafetyState</text>
<text x="823" y="224" class="body" fill="#172b46">Body 独立停止通道</text>
<path d="M944 253 L944 284 L659 284 L659 333" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="36" y="586" class="small" fill="#586779">软件中断与硬件急停分别验收。并发资源锁只覆盖同主机同用户，跨主机占用由部署层约束。</text>
</svg>
