<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Observation cache and media</title><desc id="desc">Images live in the cache and resource store. Workflows and traces carry frame references.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#586779"/></marker></defs>
<style>text{font-family:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",Arial,sans-serif} .title{font-size:27px;font-weight:600} .sub{font-size:16px} .head{font-size:20px;font-weight:600} .body{font-size:17px} .small{font-size:15px}</style>
<rect width="1120" height="430" fill="#fff"/>
<text x="36" y="48" class="title" fill="#172b46">Observation cache and media</text>
<text x="36" y="78" class="sub" fill="#586779">Images live in the cache and resource store. Workflows and traces carry frame references.</text>
<path d="M36 99 H1084" stroke="#d9e1eb"/>
<rect x="36" y="153" width="240" height="127" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M37 167 v99" stroke="#3458a4" stroke-width="3"/>
<text x="54" y="185" class="head" fill="#3458a4">Environment</text>
<text x="54" y="214" class="body" fill="#172b46">Observation.frames</text>
<text x="54" y="240" class="body" fill="#172b46">Raw RGB, depth, and state</text>
<rect x="346" y="153" width="310" height="127" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M347 167 v99" stroke="#3458a4" stroke-width="3"/>
<text x="364" y="185" class="head" fill="#3458a4">Observation Cache</text>
<text x="364" y="214" class="body" fill="#172b46">Hot cache and storage</text>
<text x="364" y="240" class="body" fill="#172b46">frame_id / cache_ref / index</text>
<rect x="738" y="132" width="346" height="98" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M739 146 v70" stroke="#3458a4" stroke-width="3"/>
<text x="756" y="164" class="head" fill="#3458a4">Runtime consumers</text>
<text x="756" y="193" class="body" fill="#172b46">Resolve frames on demand</text>
<rect x="738" y="257" width="346" height="98" rx="9" fill="#f8fafc" stroke="#d9e1eb"/><path d="M739 271 v70" stroke="#3458a4" stroke-width="3"/>
<text x="756" y="289" class="head" fill="#3458a4">History and Portal</text>
<text x="756" y="318" class="body" fill="#172b46">Resolve and display media</text>
<path d="M276 215 L346 215" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M656 200 L696 200 L696 181 L738 181" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<path d="M656 232 L696 232 L696 306 L738 306" fill="none" stroke="#586779" stroke-width="1.7" marker-end="url(#arrow)"/>
<text x="36" y="406" class="small" fill="#586779">Video is a separate artifact. A trace can reference frames that have expired or were never persisted.</text>
</svg>
