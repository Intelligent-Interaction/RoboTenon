[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotenon-benchmark-support"
version = "0.1.0"
description = "Optional Graph bindings and native protocol utilities for independent benchmark extensions"
requires-python = ">=3.10"
dependencies = ["robotenon>=0.1.0", "numpy>=1.22", "Pillow>=9.1", "anyio>=4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
robotenon_benchmark_support = ["LICENSE.upstream", "NOTICE.upstream"]
