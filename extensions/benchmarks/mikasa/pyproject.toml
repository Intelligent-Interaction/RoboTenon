[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotenon-mikasa"
version = "0.1.0"
description = "Standalone mikasa benchmark extension for RoboTenon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["robotenon>=0.1.0", "robotenon-benchmark-support>=0.1.0", "numpy>=1.22", "Pillow>=9.1", "anyio>=4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
