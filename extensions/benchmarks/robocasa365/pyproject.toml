[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotenon-robocasa365"
version = "0.1.0"
description = "Optional RoboCasa365 environment and Xiaomi-Robotics-1 integration for RoboTenon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["robotenon>=0.1.0", "robotenon-benchmark-support>=0.1.0", "numpy>=1.22", "Pillow>=9.1", "anyio>=4"]

[project.optional-dependencies]
runtime = [
  "gymnasium==0.29.1",
  "numpy>=1.24",
  "Pillow>=10",
]
dev = ["pytest>=8.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

