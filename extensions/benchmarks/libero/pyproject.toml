[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotenon-libero"
version = "0.1.0"
description = "Optional LIBERO benchmark and official policy integration for RoboTenon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["robotenon>=0.1.0", "robotenon-benchmark-support>=0.1.0", "numpy>=1.22", "Pillow>=9.1", "anyio>=4"]

[project.optional-dependencies]
runtime = [
  "libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@8f1084e3132a39270c3a13ebe37270a43ece2a01",
  "hydra-core==1.2.0",
  "numpy==1.22.4",
  "easydict==1.9",
  "transformers==4.21.1",
  "opencv-python==4.6.0.66",
  "robomimic==0.2.0",
  "einops==0.4.1",
  "robosuite==1.4.0",
  "bddl==1.0.1",
  "gym==0.25.2",
]
dev = ["pytest>=8.0"]
xiaomi = [
  "libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@8f1084e3132a39270c3a13ebe37270a43ece2a01",
  "numpy==1.22.4",
  "Pillow>=10.0",
  "torch>=2.4",
  "transformers==4.57.1",
  "accelerate>=1.0",
  "einops>=0.8",
  "timm>=1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
